<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>weGPUI browser gallery — dialog</title>
  <link rel="stylesheet" href="vendor/weui.css">
  <link rel="stylesheet" href="vendor/example.css">
  <link rel="stylesheet" href="bridge.css">
  <link rel="stylesheet" href="shell.css">
  <script src="vendor/zepto.min.js" defer=""></script>
  <script src="vendor/weui.min.js" defer=""></script>
  <script src="vendor/routes.js" defer=""></script>
  <script src="bridge.js" defer=""></script>
  <script src="router.js" defer=""></script>
</head>
<body data-weui-theme="light" data-ready="true" data-route="dialog" data-state="default" style="--weui-BRAND: #07c160; --weui-BRAND-100: #07c160; --weui-BRAND-80: #069a4d; --weui-BRAND-90: #06ae56; --weui-BRAND-120: #39cd80; --weui-BRAND-170: #b5eccf; --weui-BRAND-BG-100: #07c160; --weui-BRAND-BG-90: #06ae56; --weui-BRAND-BG-110: #20c770; --weui-BRAND-BG-130: #51d490;">
  <span aria-hidden="true" id="js_a11y_comma" class="weui-hidden_abs">，</span>
  <div id="playground-status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="playground-loading" role="status" hidden="">Loading interactive example…</div>
  <div class="container" id="container"><div class="page dialog js_show" data-route="dialog">
    <div class="page__hd" inert="">
        <h1 class="page__title">Dialog</h1>
        <p class="page__desc">对话框</p>
    </div>
    <div class="page__bd page__bd_spacing" inert="">
        <a data-original-href="javascript:" href="#" role="button" class="weui-btn weui-btn_default" id="showIOSDialog1" tabindex="0">样式一</a>
        <a data-original-href="javascript:" href="#" role="button" class="weui-btn weui-btn_default" id="showIOSDialog2" tabindex="0">样式二</a>
        <a data-original-href="javascript:" href="#" role="button" class="weui-btn weui-btn_default" id="showIOSDialog5" tabindex="0">样式三</a>
    <button id="showAndroidDialog1" type="button" class="weui-btn weui-btn_default">Android 样式一</button><button id="showAndroidDialog2" type="button" class="weui-btn weui-btn_default">Android 样式二</button></div>

    <div id="dialogs">
        <div class="js_dialog playground-overlay-open" role="dialog" aria-hidden="false" aria-modal="true" aria-labelledby="js_title1" id="iosDialog1" style="display: block;" tabindex="-1">
            <div class="weui-mask"></div>
            <div class="weui-dialog">
                <div class="weui-dialog__hd"><strong class="weui-dialog__title" id="js_title1">弹窗标题</strong></div>
                <div class="weui-dialog__bd">弹窗内容，告知当前状态、信息和解决方法，描述文字尽量控制在三行内</div>
                <div class="weui-dialog__ft">
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_default" tabindex="0">辅助操作</a>
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_primary" tabindex="0">主操作</a>
                </div>
            </div>
        </div>
        <div class="js_dialog" role="dialog" aria-hidden="true" aria-modal="true" id="iosDialog2" style="display: none;" inert="">
            <div class="weui-mask"></div>
            <div class="weui-dialog">
                <div class="weui-dialog__bd">弹窗内容，告知当前状态、信息和解决方法，描述文字尽量控制在三行内</div>
                <div class="weui-dialog__ft">
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_default" tabindex="0">辅助操作</a>
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_warn" tabindex="0">负向操作</a>
                </div>
            </div>
        </div>
        <div class="js_dialog" role="dialog" aria-hidden="true" aria-modal="true" aria-labelledby="js_title5" id="iosDialog5" style="display: none;" inert="">
            <div class="weui-mask"></div>
            <div class="weui-dialog weui-dialog_btn-wrap">
                <div class="weui-dialog__hd"><strong class="weui-dialog__title" id="js_title5">弹窗标题</strong></div>
                <div class="weui-dialog__bd">弹窗内容，告知当前状态、信息和解决方法，描述文字尽量控制在三行内</div>
                <div class="weui-dialog__ft">
                  <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_primary" tabindex="0">主操作</a>
                  <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_default" tabindex="0">辅助操作</a>
                </div>
            </div>
        </div>



        <div class="js_dialog" role="dialog" aria-hidden="true" aria-modal="true" aria-labelledby="js_title3" id="androidDialog1" style="display: none;" inert="">
            <div class="weui-mask"></div>
            <div class="weui-dialog weui-skin_android">
                <div class="weui-dialog__hd"><strong class="weui-dialog__title" id="js_title3">弹窗标题</strong></div>
                <div class="weui-dialog__bd">
                    弹窗内容，告知当前状态、信息和解决方法，描述文字尽量控制在三行内
                </div>
                <div class="weui-dialog__ft">
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_default" tabindex="0">辅助操作</a>
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_primary" tabindex="0">主操作</a>
                </div>
            </div>
        </div>
        <div class="js_dialog" role="dialog" aria-hidden="true" aria-modal="true" aria-labelledby="js_title4" id="androidDialog2" style="display: none;" inert="">
            <div class="weui-mask"></div>
            <div class="weui-dialog weui-skin_android">
                <div class="weui-dialog__bd">
                    弹窗内容，告知当前状态、信息和解决方法，描述文字尽量控制在三行内
                </div>
                <div class="weui-dialog__ft">
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_default" tabindex="0">辅助操作</a>
                    <a role="button" data-original-href="javascript:" href="#" class="weui-dialog__btn weui-dialog__btn_primary" tabindex="0">主操作</a>
                </div>
            </div>
        </div>
    </div>
</div>

</div>


</body></html>
