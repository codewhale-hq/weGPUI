<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>weGPUI browser gallery — form_vcode</title>
  <link rel="stylesheet" href="vendor/weui.css">
  <link rel="stylesheet" href="vendor/example.css">
  <link rel="stylesheet" href="bridge.css">
  <link rel="stylesheet" href="shell.css">
  <script src="vendor/zepto.min.js" defer=""></script>
  <script src="vendor/weui.min.js" defer=""></script>
  <script src="vendor/routes.js" defer=""></script>
  <script src="bridge.js" defer=""></script>
  <script src="router.js" defer=""></script>
</head>
<body data-weui-theme="light" data-ready="true" data-route="form_vcode" data-state="default" style="--weui-BRAND: #07c160; --weui-BRAND-100: #07c160; --weui-BRAND-80: #069a4d; --weui-BRAND-90: #06ae56; --weui-BRAND-120: #39cd80; --weui-BRAND-170: #b5eccf; --weui-BRAND-BG-100: #07c160; --weui-BRAND-BG-90: #06ae56; --weui-BRAND-BG-110: #20c770; --weui-BRAND-BG-130: #51d490;">
  <span aria-hidden="true" id="js_a11y_comma" class="weui-hidden_abs">，</span>
  <div id="playground-status" role="status" aria-live="polite" aria-atomic="true">cell standard：已选中</div>
  <div id="playground-loading" role="status" hidden="">Loading interactive example…</div>
  <div class="container" id="container"><div class="page form_vcode js_show" data-route="form_vcode">
  <div class="weui-form">
    <div class="weui-form__bd">
      <div class="weui-form__text-area">
        <h2 class="weui-form__title">验证码</h2>
        <div class="weui-form__desc">验证手机号样式</div>
      </div>
      <div class="weui-form__control-area">
        <div class="weui-cells__group weui-cells__group_form">
          <div class="weui-cells">
              <div class="weui-cell weui-cell_active">
                  <div class="weui-cell__hd"><label for="js_input1" class="weui-label">手机号</label></div>
                  <div class="weui-cell__bd">
                      <input id="js_input1" class="weui-input" type="number" pattern="[0-9]*" placeholder="请输入手机号" value="12345678907" style="">
                  </div>
                  <div class="weui-cell__ft">
                    <button type="button" id="showIOSDialog1" class="weui-btn_reset weui-btn_icon">
                      <i role="img" alt="帮助" class="js_target weui-icon-info-circle"></i>
                    </button>
                  </div>
              </div>
              <div id="js_cell_vcode" class="weui-cell weui-cell_active weui-cell_vcode weui-cell_wrap">
                  <div class="weui-cell__hd"><label for="js_input2" class="weui-label">验证码</label></div>
                  <div class="weui-cell__bd weui-flex">
                    <input id="js_input2" class="weui-input weui-cell__control weui-cell__control_flex" type="text" pattern="[0-9]*" placeholder="输入验证码" maxlength="6" style="">
                    <button id="js_input_clear" class="weui-btn_reset weui-btn_icon weui-btn_input-clear" type="button">
                      <i class="weui-icon-clear"></i>
                    </button>
                    <button id="js_btn_vcode" role="button" class="js_target weui-cell__control weui-btn weui-btn_default weui-vcode-btn" tabindex="0" type="button">获取验证码</button>
                  </div>
              </div>
          </div>
          <div class="weui-cells__tips"><a class="weui-link weui-wa-hotarea" data-original-href="javascript:" href="#">收不到验证码</a></div>
        </div>
      </div>
    </div>
    <div style="display: none;" class="weui-form__ft">
      <div class="weui-form__tips-area">
        <label id="weuiAgree" for="weuiAgreeCheckbox" class="weui-agree weui-wa-hotarea">
          <input id="weuiAgreeCheckbox" type="checkbox" class="weui-agree__checkbox" style=""><span class="weui-agree__text">阅读并同意<a href="/example/">《相关条款》</a>
          </span>
        </label>
      </div>
      <div class="weui-form__opr-area">
        <button class="weui-btn weui-btn_primary" type="button" id="showTooltips" aria-disabled="false">确定</button>
      </div>
    </div>
    <div class="weui-form__ft">
      <div class="weui-form__tips-area">
        <div class="weui-form__tips__group weui-form__tips__group_primary">
          <div class="weui-form__tips__wrp">
            <label id="weuiAgree1" for="weuiAgreeCheckbox1" class="weui-agree weui-wa-hotarea">
              <input id="weuiAgreeCheckbox1" type="checkbox" class="weui-agree__checkbox" style=""><span class="weui-agree__text">阅读并同意<a href="/example/">《相关条款》</a>
              </span>
            </label>
          </div>
          <div class="weui-form__tips__wrp">
            <label id="weuiAgree0" for="weuiAgreeCheckbox0" class="weui-agree weui-wa-hotarea">
              <input id="weuiAgreeCheckbox0" type="checkbox" class="weui-agree__checkbox" style=""><span class="weui-agree__text">以上信息用于核对账号绑定的身份</span>
            </label>
          </div>
        </div>
      </div>
      <div class="weui-form__opr-area">
        <button class="weui-btn weui-btn_primary" type="button" id="showTooltips">确定</button>
      </div>
    </div>
  </div>
  <div role="alert" id="js_toast" style="display: none;">
      <div class="weui-mask_transparent"></div>
      <div class="weui-toast">
          <i class="weui-icon-success-no-circle weui-icon_toast"></i>
          <p class="weui-toast__content">已完成</p>
      </div>
  </div>
  <div role="alert" id="js_agree_msg" class="weui-hidden_abs" style="display: none;">未同意《相关条款》</div>
  <div id="dialogs">
      <!--BEGIN dialog1-->
      <div role="dialog" aria-modal="true" class="js_dialog" id="iosDialog1" style="display: none;">
          <div class="weui-mask"></div>
          <div id="js_half_screen_dialog" class="weui-half-screen-dialog">
              <div class="weui-half-screen-dialog__hd">
                <div class="weui-half-screen-dialog__hd__side">
                    <button id="dialogClose" class="weui-icon-btn" type="button">关闭<i class="weui-icon-close-thin"></i></button>
                </div>
                <div class="weui-half-screen-dialog__hd__main">
                  <strong class="weui-half-screen-dialog__title">标题</strong>
                </div>
              </div>
              <div class="weui-half-screen-dialog__bd">
                <br>
                <br>
                可放自定义内容
                <br>
                <br>
                <br>
                <br>
              </div>
          </div>
      </div>
      <!--END dialog1-->
  </div>
</div>


</div>


</body></html>
