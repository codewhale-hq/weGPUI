<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>weGPUI browser gallery — picker</title>
  <link rel="stylesheet" href="vendor/weui.css">
  <link rel="stylesheet" href="vendor/example.css">
  <link rel="stylesheet" href="bridge.css">
  <link rel="stylesheet" href="shell.css">
  <script src="vendor/zepto.min.js" defer=""></script>
  <script src="vendor/weui.min.js" defer=""></script>
  <script src="vendor/routes.js" defer=""></script>
  <script src="bridge.js" defer=""></script>
  <script src="router.js" defer=""></script>
</head>
<body data-weui-theme="light" data-ready="true" data-route="picker" data-state="default" style="--weui-BRAND: #07c160; --weui-BRAND-100: #07c160; --weui-BRAND-80: #069a4d; --weui-BRAND-90: #06ae56; --weui-BRAND-120: #39cd80; --weui-BRAND-170: #b5eccf; --weui-BRAND-BG-100: #07c160; --weui-BRAND-BG-90: #06ae56; --weui-BRAND-BG-110: #20c770; --weui-BRAND-BG-130: #51d490;">
  <span aria-hidden="true" id="js_a11y_comma" class="weui-hidden_abs">，</span>
  <div id="playground-status" role="status" aria-live="polite" aria-atomic="true">已取消搜索</div>
  <div id="playground-loading" role="status" hidden="">Loading interactive example…</div>
  <div class="container" id="container"><div class="page picker js_show" data-route="picker">
    <div class="page__hd" inert="">
        <h1 class="page__title">Picker</h1>
        <p class="page__desc">多列选择器，需要配合js实现</p>
    </div>
    <div class="page__bd page__bd_spacing" inert="">
        <a data-original-href="javascript:" href="#" role="button" class="weui-btn weui-btn_default" id="showPicker" tabindex="0">单列选择器</a>
        <a data-original-href="javascript:" href="#" role="button" class="weui-btn weui-btn_default" id="showDatePicker" tabindex="0">日期选择器</a>
    <button id="showMultiPicker" type="button" class="weui-btn weui-btn_default">多列选择器</button><button id="showCascadePicker" type="button" class="weui-btn weui-btn_default">级联选择器</button></div>
<div class="playground-picker-wrap playground-overlay-open" data-temporary="true" aria-label="单列选择器" aria-hidden="false" role="dialog" aria-modal="true" tabindex="-1" style="display: block;"><div class="weui-mask"></div><div class="weui-half-screen-dialog weui-picker playground-picker weui-half-screen-dialog_show"><div class="weui-half-screen-dialog__hd"><button type="button" class="weui-btn_icon weui-wa-hotarea" aria-label="取消">取消</button><strong class="weui-half-screen-dialog__title">单列选择器</strong></div><div class="weui-picker__bd"><div class="weui-picker__group" role="listbox" tabindex="0" aria-label="第 1 列" aria-activedescendant="web-picker-1-0-2"><div class="weui-picker__mask"></div><div class="weui-picker__indicator"></div><div class="weui-picker__content" style="transform: translateY(0px);"><div class="weui-picker__item" role="option" id="web-picker-1-0-0" aria-disabled="false" aria-selected="false">飞机票</div><div class="weui-picker__item" role="option" id="web-picker-1-0-1" aria-disabled="false" aria-selected="false">火车票</div><div class="weui-picker__item" role="option" id="web-picker-1-0-2" aria-disabled="false" aria-selected="true">的士票</div><div class="weui-picker__item weui-picker__item_disabled" role="option" id="web-picker-1-0-3" aria-disabled="true" aria-selected="false">公交票 (disabled)</div><div class="weui-picker__item" role="option" id="web-picker-1-0-4" aria-disabled="false" aria-selected="false">其他</div></div></div></div><div class="weui-half-screen-dialog__ft"><button type="button" class="weui-btn weui-btn_primary">确定</button></div></div></div></div>


</div>


</body></html>
