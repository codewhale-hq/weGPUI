name: Experimental iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Experimental simulator build (known upstream blocker)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apple tooling
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -t aarch64-apple-ios-sim
          rustup default stable
      - run: cargo +stable fetch --locked
      - name: Build simulator bundle (does not install or launch)
        run: bash examples/ios/build-simulator.sh gallery
      - name: Preserve simulator build diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-diagnostics
          path: |
            target/ios-simulator/**/*.jsonl
            target/ios-simulator/**/*.stderr
            target/ios-simulator/**/codesign.txt
            target/ios-simulator/**/Info.plist
          if-no-files-found: ignore
          retention-days: 7
