name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux build, contracts and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev pkg-config clang
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt
      - run: cargo +stable fetch --locked
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable build --all-targets --locked --offline
      - run: cargo +stable test --lib --locked --offline
      - run: cargo +stable test --example gallery --locked --offline
      - run: cargo +stable clippy --all-targets --locked --offline -- -D warnings
      - name: Strict documentation
        run: cargo +stable doc --no-deps --locked --offline
        env:
          RUSTDOCFLAGS: -D warnings -W missing-docs
      - name: Extracted vendored text contracts
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          python3 -I docs/proposals/gpui-text-i18n/verify-word-break.py --workdir "${CARGO_TARGET_DIR:-target}/text-contracts/word-break"
          python3 -I docs/proposals/gpui-text-i18n/verify-logical-wrap.py --workdir "${CARGO_TARGET_DIR:-target}/text-contracts/logical-wrap"
          python3 -I docs/proposals/gpui-trailing-space-wrap/verify.py --workdir "${CARGO_TARGET_DIR:-target}/text-contracts/trailing-space"
          python3 -I docs/proposals/gpui-cjk-closing/verify.py --workdir "${CARGO_TARGET_DIR:-target}/text-contracts/cjk-closing"
      - name: Build complete showcase
        run: |
          python3 -m unittest discover -s website/tests -v
          node --check website/app.js
          python3 website/build.py --include-api
      - name: Preserve reviewable website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wegpui-website
          path: website/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Bundle script contracts (fake tools, no Apple runtime)
        run: |
          bash -n examples/ios/build-simulator.sh
          python3 -m unittest discover -s scripts/tests -v

  linux-msrv:
    name: Linux Rust 1.95 build and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev pkg-config clang
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --all-targets --locked
      - run: cargo +1.95.0 test --lib --locked --offline
      - run: cargo +1.95.0 test --example gallery --locked --offline

  mobile-typecheck:
    name: Mobile library type-checks only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -t aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android
      - run: cargo +stable check --lib --locked --target aarch64-apple-ios
      - run: cargo +stable check --lib --locked --target aarch64-apple-ios-sim
      - run: cargo +stable check --lib --locked --target aarch64-linux-android

  macos:
    name: macOS native build (no runtime acceptance)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apple tooling
        run: |
          sw_vers
          xcodebuild -version
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
      - run: cargo +stable fetch --locked
      - run: cargo +stable build --all-targets --locked --offline
      - run: cargo +stable test --lib --locked --offline
      - run: cargo +stable test --example gallery --locked --offline
      - run: cargo +stable clippy --all-targets --locked --offline -- -D warnings

  windows:
    name: Windows MSVC build (no runtime acceptance)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -c clippy
      - run: cargo +stable fetch --locked
      - run: cargo +stable build --all-targets --locked --offline
      - run: cargo +stable test --lib --locked --offline
      - run: cargo +stable test --example gallery --locked --offline
      - run: cargo +stable clippy --all-targets --locked --offline -- -D warnings
