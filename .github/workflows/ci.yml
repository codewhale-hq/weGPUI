name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux build, contracts and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev pkg-config clang
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt
      - run: cargo +stable fetch --locked
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable build --all-targets --locked --offline
      - run: cargo +stable test --lib --locked --offline
      - run: cargo +stable clippy --all-targets --locked --offline -- -D warnings
      - name: Strict documentation
        run: cargo +stable doc --no-deps --locked --offline
        env:
          RUSTDOCFLAGS: -D warnings -W missing-docs
      - name: Bundle script contracts (fake tools, no Apple runtime)
        run: |
          bash -n examples/ios/build-simulator.sh
          python3 -m unittest discover -s scripts/tests -v

  linux-msrv:
    name: Linux Rust 1.95 build and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev pkg-config clang
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --all-targets --locked
      - run: cargo +1.95.0 test --lib --locked --offline

  mobile-typecheck:
    name: Mobile library type-checks only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -t aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android
      - run: cargo +stable check --lib --locked --target aarch64-apple-ios
      - run: cargo +stable check --lib --locked --target aarch64-apple-ios-sim
      - run: cargo +stable check --lib --locked --target aarch64-linux-android

  macos:
    name: Apple builds only (no runtime acceptance)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apple tooling
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy -t aarch64-apple-ios-sim
          rustup default stable
      - run: cargo +stable fetch --locked
      - run: cargo +stable build --all-targets --locked --offline
      - run: cargo +stable test --lib --locked --offline
      - run: cargo +stable clippy --all-targets --locked --offline -- -D warnings
      - name: Build simulator bundle (does not install or launch)
        run: bash examples/ios/build-simulator.sh gallery
      - name: Preserve simulator build diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-diagnostics
          path: |
            target/ios-simulator/**/*.jsonl
            target/ios-simulator/**/*.stderr
            target/ios-simulator/**/codesign.txt
            target/ios-simulator/**/Info.plist
          if-no-files-found: ignore
          retention-days: 7
